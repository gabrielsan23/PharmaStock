<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="d-flex">

  <!-- BARRA LATERAL -->
  <aside class="sidebar position-fixed top-0 bottom-0 start-0 d-flex flex-column p-3">

    <!-- LOGO -->
    <a routerLink="/dashboard" class="text-decoration-none">
      <div class="d-flex align-items-center gap-2 px-2 mb-4">
        <div class="logo-box d-flex align-items-center justify-content-center text-white flex-shrink-0">
          <i class="bi bi-archive-fill fs-5"></i>
        </div>

        <div>
          <h6 class="fw-bold mb-0 text-dark">PharmaStock</h6>
          <small class="text-secondary">Projeto Integrador</small>
        </div>
      </div>
    </a>

    <!-- MENU PRINCIPAL -->
    <nav class="nav flex-column gap-1">

      
      <a class="sidebar-link" routerLink="/dashboard" routerLinkActive="active">
        <i class="bi bi-grid"></i>
        <span>Dashboard</span>
      </a>

      <a class="sidebar-link" routerLink="/medicamentos" routerLinkActive="active">
        <i class="bi bi-bag-plus"></i>
        <span>Medicamentos</span>
      </a>

      <a class="sidebar-link" routerLink="/movimentacoes" routerLinkActive="active">
        <i class="bi bi-arrow-left-right"></i>
        <span>Movimentações</span>
      </a>

      <a class="sidebar-link" routerLink="/alertas" routerLinkActive="active">
        <i class="bi bi-bell"></i>
        <span>Alertas</span>
      </a>

      <a class="sidebar-link" routerLink="/lotes" routerLinkActive="active">
        <i class="bi bi-archive"></i>
        <span>Lotes</span>
      </a>

      <a class="sidebar-link" routerLink="/relatorios" routerLinkActive="active">
        <i class="bi bi-bar-chart"></i>
        <span>Relatórios</span>
      </a>

      <a class="sidebar-link" routerLink="/rastreamentos" routerLinkActive="active">
        <i class="bi bi-graph-up-arrow"></i>
        <span>Rastreamento</span>
      </a>

      <a class="sidebar-link" routerLink="/usuarios" routerLinkActive="active">
        <i class="bi bi-people"></i>
        <span>Usuários</span>
      </a>

      <a class="sidebar-link" routerLink="/fornecedores" routerLinkActive="active">
        <i class="bi bi-truck"></i>
        <span>Fornecedores</span>
      </a>

      <a class="sidebar-link" routerLink="/reposicao" routerLinkActive="active">
        <i class="bi bi-arrow-repeat"></i>
        <span>Reposição</span>
      </a>

      <a class="sidebar-link" routerLink="/erp" routerLinkActive="active">
        <i class="bi bi-gear"></i>
        <span>ERP</span>
      </a>

    </nav>

    <!-- MENU INFERIOR -->
    <div class="mt-auto border-top pt-3">
      <nav class="nav flex-column gap-1">

        <a class="sidebar-link" routerLink="/configuracoes" routerLinkActive="active">
          <i class="bi bi-gear"></i>
          <span>Configurações</span>
        </a>

        <a class="sidebar-link" routerLink="/suporte" routerLinkActive="active">
          <i class="bi bi-question-circle"></i>
          <span>Suporte</span>
        </a>

      </nav>
    </div>

  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-grow-1 min-vh-100 bg-light" style="margin-left: 230px; min-width: 0;">
    <!-- BARRA SUPERIOR -->
    <header class="navbar bg-white border-bottom px-4 py-2 sticky-top">

      <!-- TÍTULO -->
      <div class="d-flex align-items-center">
        <h5 class="fw-bold mb-0 text-dark">
          PharmaStock Management
        </h5>
      </div>

      <!-- AÇÕES E PERFIL -->
      <div class="d-flex align-items-center gap-4">

        <!-- PESQUISA -->
        <button type="button" class="btn btn-link text-dark p-0" title="Pesquisar">
          <i class="bi bi-search fs-5"></i>
        </button>

        <!-- NOTIFICAÇÕES -->
        <button type="button" class="btn btn-link text-dark p-0 position-relative" title="Notificações">
          <i class="bi bi-bell fs-5"></i>

          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger p-1">
          </span>
        </button>

        <!-- SEPARADOR -->
        <div class="vr"></div>

        <!-- USUÁRIO -->
        <div class="d-flex align-items-center gap-3">

          <div class="text-end">
            <div class="fw-semibold small text-dark">
              Dr. Roberto Silva
            </div>

            <small class="text-secondary">
              Administrador
            </small>
          </div>

          <!-- FOTO / PERFIL -->
          <button type="button" class="btn btn-light rounded-circle d-flex align-items-center justify-content-center"
            style="width: 38px; height: 38px;" title="Perfil do usuário" routerLink="/configuracoes">
            <i class="bi bi-person-circle fs-4"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- CONTEÚDO DAS ROTAS -->
    <div class="container-fluid p-4">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
